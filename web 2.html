<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Me - Self Reflection App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#fff3c4,#ffe28a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* App Container */
.app{
width:100%;
max-width:900px;
min-height:600px;
background:#fff;
border-radius:25px;
box-shadow:0 20px 60px rgba(0,0,0,0.15);
display:flex;
flex-direction:column;
overflow:hidden;
position:relative;
}

/* Splash Screen */
.splash{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd966,#f4b400);
text-align:center;
color:white;
padding:40px;
}

.splash img{
width:160px;
height:160px;
object-fit:cover;
border-radius:30px;
background:#fff;
padding:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
margin-bottom:25px;
animation:float 3s ease-in-out infinite;
}

.splash h1{
font-size:36px;
font-weight:700;
margin-bottom:10px;
}

.start-btn{
margin-top:20px;
padding:14px 35px;
border:none;
border-radius:30px;
background:white;
color:#f4b400;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.start-btn:hover{
transform:scale(1.05);
}

/* Question Screen */
.screen{
flex:1;
padding:40px;
display:none;
flex-direction:column;
overflow-y:auto;
}

.progress{
font-size:14px;
margin-bottom:15px;
color:#888;
}

.question{
font-size:22px;
margin-bottom:20px;
font-weight:600;
color:#f4b400;
}

textarea{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:12px;
border:1px solid #ddd;
resize:none;
font-size:14px;
transition:0.3s;
}

textarea:focus{
border:1px solid #f4b400;
outline:none;
box-shadow:0 0 0 3px rgba(244,180,0,0.15);
}

/* Buttons */
.button-group{
display:flex;
justify-content:space-between;
gap:15px;
margin-top:20px;
}

.btn{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.back-btn{
background:#f0f0f0;
color:#555;
}

.back-btn:hover{
background:#e2e2e2;
}

.next-btn{
background:#f4b400;
color:white;
}

.next-btn:hover{
background:#d99900;
}

/* Result Screen */
.result{
flex:1;
padding:40px;
display:none;
overflow-y:auto;
}

.result h2{
margin-bottom:25px;
color:#f4b400;
text-align:center;
font-size:26px;
}

.result-item{
margin-bottom:15px;
font-size:14px;
padding:15px;
background:#fff9e6;
border-radius:10px;
}

/* Mobile Responsive */
@media(max-width:768px){

body{
padding:0;
}

.app{
max-width:100%;
height:100vh;
border-radius:0;
}

.screen,
.result{
padding:25px;
}

.splash{
padding:30px;
}

.splash h1{
font-size:28px;
}

.question{
font-size:18px;
}
}

/* Animation */
@keyframes float{
0%{ transform:translateY(0px);}
50%{ transform:translateY(-10px);}
100%{ transform:translateY(0px);}
}
</style>
</head>
<body>

<div class="app">

<!-- Splash -->
<div class="splash" id="splash">
<img src="1.jpg" alt="Dear Me Logo">
<h1>Dear Me</h1>
<button class="start-btn" onclick="startApp()">Start Reflection</button>
</div>

<!-- Question Screen -->
<div class="screen" id="questionScreen">
<div class="progress" id="progress"></div>
<div class="question" id="questionText"></div>

<textarea placeholder="Answer 1"></textarea>
<textarea placeholder="Answer 2"></textarea>
<textarea placeholder="Answer 3"></textarea>

<div class="button-group">
<button class="btn back-btn" onclick="previousQuestion()">Back</button>
<button class="btn next-btn" onclick="nextQuestion()">Next</button>
</div>
</div>

<!-- Result Screen -->
<div class="result" id="resultScreen">
<h2>Your Reflection Summary</h2>
<div id="resultContent"></div>
<button class="btn next-btn" onclick="restartApp()">Restart</button>
</div>

</div>

<script>
const questions = [
"How do you fill your space?",
"How do you spend your time?",
"How do you spend your energy?",
"How do you spend your money?",
"What are you most organized?",
"Where are you most reliable?",
"What dominates your thoughts?",
"What do you visualize most?",
"What do you most often talk to yourself about?",
"What do you most often talk to others about?",
"What inspires you?",
"What goals stand out in your life? (Top 3)",
"What topics do you study or research?"
];

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null).map(()=>["","",""]);

function startApp(){
document.getElementById("splash").style.display="none";
document.getElementById("questionScreen").style.display="flex";
showQuestion();
}

function showQuestion(){
document.getElementById("progress").innerText =
"Question " + (currentQuestion+1) + " of " + questions.length;

document.getElementById("questionText").innerText =
questions[currentQuestion];

let inputs = document.querySelectorAll("textarea");
inputs.forEach((t,i)=>t.value = answers[currentQuestion][i] || "");

document.querySelector(".back-btn").style.visibility =
currentQuestion === 0 ? "hidden" : "visible";
}

function nextQuestion(){
let inputs = document.querySelectorAll("textarea");
inputs.forEach((t,i)=>answers[currentQuestion][i] = t.value);

if(currentQuestion < questions.length - 1){
currentQuestion++;
showQuestion();
}else{
showResults();
}
}

function previousQuestion(){
let inputs = document.querySelectorAll("textarea");
inputs.forEach((t,i)=>answers[currentQuestion][i] = t.value);

if(currentQuestion > 0){
currentQuestion--;
showQuestion();
}
}

function showResults(){
document.getElementById("questionScreen").style.display="none";
document.getElementById("resultScreen").style.display="block";

let content = "";
answers.forEach((ans,index)=>{
content += "<div class='result-item'><strong>"
+ questions[index] + "</strong><br>"
+ ans.filter(a=>a).join(", ") + "</div>";
});

document.getElementById("resultContent").innerHTML = content;
}

function restartApp(){
location.reload();
}
</script>

</body>
</html>
